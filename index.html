<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MARKOV MADE GYM</title>
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="MARKOV MADE GYM — локальный тренировочный журнал, библиотека упражнений и персональный тренировочный интерфейс.">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html,body{height:100%;margin:0;background:#0b0b0b;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    .boot{max-width:32rem;padding:2rem;text-align:center}
    .boot strong{display:block;font-size:1.05rem;letter-spacing:.04em}
    .boot span{display:block;margin-top:.7rem;color:#a8a8a8;font-size:.9rem}
  </style>
</head>
<body>
  <div class="boot"><strong>MARKOV MADE GYM</strong><span>Загрузка Product Excellence R2…</span></div>
  <script>
  (async()=>{
    const fallback=()=>{
      const target=new URL('./legacy-base.html',location.href);
      target.search=location.search;
      target.hash=location.hash;
      location.replace(target.href);
    };
    try{
      if(!('DecompressionStream' in window)) return fallback();
      const response=await fetch('./r2.payload.b64',{cache:'no-store'});
      if(!response.ok) throw new Error('payload '+response.status);
      const b64=(await response.text()).trim();
      if(b64.length<600000) throw new Error('payload truncated');
      const binary=atob(b64);
      const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=new TextDecoder().decode(await new Response(stream).arrayBuffer());
      if(html.length<2500000||!html.includes('MARKOV MADE GYM')) throw new Error('invalid R2 payload');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error('[MMG R2 bootstrap]',error);
      fallback();
    }
  })();
  </script>
  <script>
    if('serviceWorker' in navigator){
      addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
