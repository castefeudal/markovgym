name: quality

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Syntax
        run: npm run syntax

      - name: Unit and smoke tests
        run: npm test

      - name: Rebuild canonical index
        run: npm run build:index

      - name: Guard generated-file drift
        run: git diff --exit-code -- index.html

      - name: End-to-end and accessibility
        run: npm run e2e

      - name: Visual smoke
        run: npm run visual

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
