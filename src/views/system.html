<section class="section" id="system" aria-labelledby="system-title" hidden>
    <div class="container">
      <div class="dash" id="dash" hidden>
        <div class="dash-head">
          <div>
            <p class="eyebrow" data-i18n="dash.eyebrow">Личный контур</p>
            <h2 class="dash-title" id="system-title" data-i18n="dash.title">Моя система</h2>
          </div>
          <div class="dash-goal">
            <span class="signal" id="dash-signal" data-state="none">—</span>
            <button class="btn btn-quiet btn-sm" id="dash-edit" type="button" data-i18n="dash.edit">Изменить настройки</button>
          </div>
        </div>
        <div class="dash-body">
          <div class="dash-tiles" id="dash-tiles"></div>
          <div class="dash-next" id="dash-next"></div>
          <div id="dash-note"></div>
        </div>
      </div>

    </div>
  </section>
